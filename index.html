<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sri Sai Swathi Lakkoju | Avionics & Edge AI</title>
    
    <!-- Google Fonts for Premium Tech Look -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #030303;
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.06);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --primary-gradient: linear-gradient(135deg, #00f2ff 0%, #7928ca 100%);
            --accent-glow: 0 0 30px rgba(0, 242, 255, 0.25);
            --neon-blue: #00f2ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            line-height: 1.7;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* --- AMBIENT NEBULA BACKGROUND --- */
        .background-fx {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: 
                radial-gradient(circle at 10% 40%, rgba(0, 242, 255, 0.05), transparent 30%),
                radial-gradient(circle at 90% 20%, rgba(121, 40, 202, 0.06), transparent 30%);
            animation: drift 20s ease-in-out infinite alternate;
        }

        @keyframes drift {
            0% { transform: scale(1) translate(0px, 0px); }
            100% { transform: scale(1.1) translate(20px, -20px); }
        }

        /* --- PURE CSS 3D CUBE ANIMATION CONTROLLER --- */
        .canvas-container {
            position: absolute;
            top: 60px;
            right: 10%;
            width: 300px;
            height: 300px;
            perspective: 800px;
            z-index: -1;
        }

        .cube-matrix {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: autoRotate 18s linear infinite;
        }

        @keyframes autoRotate {
            0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
            100% { transform: rotateX(360deg) rotateY(720deg) rotateZ(360deg); }
        }

        .cube-face {
            position: absolute;
            width: 120px;
            height: 120px;
            top: 90px;
            left: 90px;
            background: rgba(0, 242, 255, 0.02);
            border: 1px solid rgba(0, 242, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.1);
            backdrop-filter: blur(2px);
        }

        /* 3D positioning mapping */
        .front  { transform: translateZ(60px); }
        .back   { transform: rotateY(180deg) translateZ(60px); }
        .left   { transform: rotateY(-90deg) translateZ(60px); border-color: rgba(121, 40, 202, 0.4); }
        .right  { transform: rotateY(90deg) translateZ(60px); border-color: rgba(121, 40, 202, 0.4); }
        .top    { transform: rotateX(90deg) translateZ(60px); }
        .bottom { transform: rotateX(-90deg) translateZ(60px); }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 80px 24px;
        }

        /* --- HERO HEADER SETUP --- */
        header {
            margin-bottom: 100px;
            position: relative;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            color: var(--neon-blue);
            background: rgba(0, 242, 255, 0.06);
            padding: 8px 16px;
            border-radius: 50px;
            margin-bottom: 24px;
            border: 1px solid rgba(0, 242, 255, 0.15);
            backdrop-filter: blur(8px);
        }

        .badge-pulse {
            width: 6px;
            height: 6px;
            background-color: var(--neon-blue);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-blue);
            animation: beacon 1.5s infinite;
        }

        @keyframes beacon {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 12px var(--neon-blue); }
            100% { transform: scale(0.9); opacity: 0.6; }
        }

        h1 {
            font-size: clamp(3rem, 5vw, 4.5rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 24px;
            background: linear-gradient(to right, #ffffff 30%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1.5px;
        }

        .bio {
            font-size: 1.25rem;
            color: var(--text-muted);
            max-width: 680px;
            font-weight: 300;
        }

        .bio strong {
            color: #fff;
            font-weight: 500;
        }

        /* --- MODERN GLOW CARDS --- */
        section { margin-bottom: 80px; }

        .section-title {
            font-size: 0.85rem;
            font-family: 'Space Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #64748b;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .section-title::after {
            content: '';
            height: 1px;
            background: linear-gradient(90deg, var(--glass-border), transparent);
            flex-grow: 1;
        }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 36px;
            margin-bottom: 24px;
            backdrop-filter: blur(16px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .card:hover {
            transform: translateY(-4px) scale(1.01);
            border-color: rgba(0, 242, 255, 0.25);
            background: rgba(255, 255, 255, 0.03);
            box-shadow: var(--accent-glow);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .role {
            font-size: 1.4rem;
            font-weight: 600;
            color: #fff;
            letter-spacing: -0.3px;
        }

        .company {
            background: linear-gradient(90deg, #00f2ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Space Mono', monospace;
            font-size: 0.95rem;
            font-weight: 700;
        }

        .year {
            font-family: 'Space Mono', monospace;
            color: var(--text-muted);
            font-size: 0.8rem;
            padding: 6px 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
        }

        ul { list-style: none; }

        li {
            color: var(--text-muted);
            margin-bottom: 12px;
            position: relative;
            padding-left: 24px;
            font-size: 1.05rem;
        }

        li::before {
            content: '//';
            position: absolute;
            left: 0;
            color: var(--neon-blue);
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            opacity: 0.7;
        }

        /* --- INTERACTIVE SKILLS MODULE --- */
        .skills-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px;
        }

        .skill-tag {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--glass-border);
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-muted);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .skill-tag:hover {
            background: var(--primary-gradient);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 8px 20px rgba(0, 242, 255, 0.2);
            transform: scale(1.05);
        }

        /* --- COMPONENT BUTTONS --- */
        .cta-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 16px 32px;
            background: #ffffff;
            color: #000000;
            text-decoration: none;
            font-weight: 600;
            border-radius: 50px;
            margin-top: 24px;
            transition: all 0.3s ease;
        }

        .cta-btn:hover {
            background: var(--primary-gradient);
            color: #ffffff;
            box-shadow: var(--accent-glow);
            transform: translateY(-2px);
        }

        @media (max-width: 900px) {
            .canvas-container { display: none; } /* Hide 3D asset on small mobile layouts to keep fast response */
            h1 { font-size: 2.8rem; }
            .container { padding: 50px 20px; }
        }
    </style>
</head>
<body>

    <!-- Ambient Animation Matrix Layer -->
    <div class="background-fx"></div>

    <div class="container">
        
        <header>
